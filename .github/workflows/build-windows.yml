name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging\FilmSetRecorder.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\FilmSetRecorder.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FilmSetRecorder-Windows-Installer
          path: release/FilmSetRecorder_Setup_0.1.0.exe
          retention-days: 14
